[package]
name = "crabboy-advance"
version = "5.1.0"
edition = "2021"
description = "CrabBoy Advance: Cycle-accurate Game Boy Advance emulator in Rust with 5.1 Spatial Audio, xBRZ/NIS upscaling, TAS Engine, and Hardware Sensors"
license = "MIT"
repository = "https://github.com/ssilkdev/CrabBoy-Advance"

[lib]
name = "gba_simulator"
path = "src/lib.rs"

[[bin]]
name = "crabboy-advance"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
# The desktop GUI front-end (`ui` module + the `crabboy-advance` binary).
# The emulator cores (`gba`, `dmg`) need none of these, which is what lets the
# Android front-end in `android/` depend on this crate with
# `default-features = false`.
desktop = ["dep:eframe", "dep:egui", "dep:rfd", "dep:env_logger", "dep:gilrs", "dep:xbrz", "dep:sha2", "dep:miniz_oxide"]

[dependencies]
# Core (always built, including on Android)
cpal = "0.15"
byteorder = "1.5"
log = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"

# Desktop front-end only
eframe = { version = "0.31", optional = true }
egui = { version = "0.31", optional = true }
rfd = { version = "0.15", optional = true }
env_logger = { version = "0.11", optional = true }
gilrs = { version = "0.11", optional = true }
xbrz = { package = "xbrz-rs", version = "0.1.0", optional = true }
sha2 = { version = "0.10", optional = true }
# Inflate for PDF FlateDecode content streams (game-guide ingestion). Already
# in the graph transitively via `png`; naming it here keeps the guide parser
# free of a full PDF crate and its dozens of transitive dependencies.
miniz_oxide = { version = "0.8", optional = true }

# winres embeds a PE .rsrc section (icon + version info) and is meaningful only
# when the TARGET is Windows. Scoping it here keeps it out of the dependency
# graph for native Linux/macOS builds entirely.
[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.dev]
opt-level = 2

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
