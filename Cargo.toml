[package]
name = "crabboy-advance"
version = "0.3.0"
edition = "2021"
description = "CrabBoy Advance: Cycle-accurate Game Boy Advance emulator in Rust with 5.1 Spatial Audio, xBRZ/NIS upscaling, TAS Engine, and Hardware Sensors"
license = "MIT"
repository = "https://github.com/ssilkdev/CrabBoy-Advance"

[lib]
name = "gba_simulator"
path = "src/lib.rs"

[[bin]]
name = "crabboy-advance"
path = "src/main.rs"

[dependencies]
eframe = "0.31"
egui = "0.31"
cpal = "0.15"
rfd = "0.15"
byteorder = "1.5"
log = "0.4"
env_logger = "0.11"
gilrs = "0.11"
xbrz = { package = "xbrz-rs", version = "0.1.0" }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"

[build-dependencies]
winres = "0.1"

[profile.dev]
opt-level = 2

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
